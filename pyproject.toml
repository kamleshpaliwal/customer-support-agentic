[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent-system"
version = "0.1.0"
description = "LangGraph customer support system with MCP-backed specialist tools"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=0.2,<2",
    "langchain-core>=0.3,<2",
    "langchain-ollama>=1.0,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "asyncpg>=0.29,<1",
    "mcp[cli]>=2,<3",
    "boto3>=1.37,<2",
    "flask>=3.0,<4",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]
eval = ["ragas>=0.4.3,<0.5", "langchain-community>=0.3.31,<0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"support_agents.db" = ["migrations/*.sql"]
"support_agents" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
