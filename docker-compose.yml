services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: support_fees
      POSTGRES_USER: support_app
      POSTGRES_PASSWORD: support_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_app -d support_fees"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
